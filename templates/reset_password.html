<!doctype html><html lang="de" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neues Passwort – Sternsinger {{ app_version }}</title><script>(()=>{const t=localStorage.getItem('sternsinger_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t})()</script><style>
:root{color-scheme:light;--bg:#f5f5f3;--surface:#fff;--surface2:#f8fafc;--text:#171717;--muted:#737373;--line:rgba(23,23,23,.10);--brand:#3457d5;--ok:#177245;--okbg:#eaf7f0;--danger:#b4233b;--dangerbg:#fff0f2}html[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--surface:#171a20;--surface2:#1c2027;--text:#f4f4f5;--muted:#9299a3;--line:rgba(255,255,255,.085);--brand:#8198ff;--ok:#5fd39a;--okbg:#153529;--danger:#ff7f96;--dangerbg:#3a1c24}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.card{width:min(470px,100%);background:var(--surface);border-radius:18px;padding:30px;border:1px solid var(--line);box-shadow:0 26px 80px rgba(20,36,50,.13)}h1{margin:0 0 8px;font-size:1.65rem;letter-spacing:-.04em}p{color:var(--muted);line-height:1.55}label{display:block;font-weight:760;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--surface2);color:var(--text)}button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:820;margin-top:18px;cursor:pointer}.msg,.err{padding:11px 12px;border-radius:11px;margin:14px 0}.msg{background:var(--okbg);color:var(--ok)}.err{background:var(--dangerbg);color:var(--danger)}a{color:var(--brand);font-weight:760;text-decoration:none}.back{margin-top:18px;text-align:center}
</style>
<style>
:root{--v41-bg:#ddd4c4;--v41-surface:#f2ece1;--v41-surface2:#e8dfd1;--v41-text:#1f1a14;--v41-muted:#655948;--v41-line:rgba(64,49,28,.22);--v41-gold:#b07a11;--v41-gold2:#7f5708;--v41-goldsoft:#e8d39d}
html[data-theme="dark"]{--v41-bg:#0d0c0a;--v41-surface:#1a1712;--v41-surface2:#242019;--v41-text:#fff8ea;--v41-muted:#b9aa92;--v41-line:rgba(232,199,120,.18);--v41-gold:#e0b34f;--v41-gold2:#efc96e;--v41-goldsoft:#3b2f18}
body{background:var(--v41-bg)!important;color:var(--v41-text)!important}
.card,.panel,.login-card,.privacy-card,.reset-card,.viewer-shell,.map-shell,.container{border-color:var(--v41-line)!important}
input,select,textarea{background:var(--v41-surface)!important;color:var(--v41-text)!important;border-color:var(--v41-line)!important}
input:focus,select:focus,textarea:focus{border-color:var(--v41-gold)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--v41-gold) 18%,transparent)!important}
.btn-primary,button.primary,.primary{background:linear-gradient(135deg,var(--v41-gold2),var(--v41-gold))!important;color:#fffaf0!important;border-color:transparent!important}
a{color:var(--v41-gold2)}
</style>
<link rel="stylesheet" href="/static/auth.css?v={{ app_version }}">
</head><body><main class="card"><h1>Neues Passwort setzen</h1>{% if success %}<div class="msg">{{ success }}</div>{% endif %}{% if error %}<div class="err">{{ error }}</div>{% endif %}{% if valid %}<p>Wähle ein neues Passwort mit mindestens 8 Zeichen.</p><form method="post"><label for="password">Neues Passwort</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required autofocus><label for="repeat">Passwort wiederholen</label><input id="repeat" type="password" name="repeat" autocomplete="new-password" minlength="8" required><button type="submit">Passwort speichern</button></form>{% elif not success %}<p>Dieser Link ist ungültig, bereits verwendet oder abgelaufen.</p>{% endif %}<div class="back"><a href="{{ url_for('login') }}">← Zur Anmeldung</a> · <a href="/datenschutz">Datenschutz</a></div></main></body></html>
