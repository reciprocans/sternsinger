<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmeldung – Sternsinger Verwaltung {{ app_version }}</title>
  <script>(()=>{const t=localStorage.getItem('sternsinger_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;})()</script>
  <style>
    :root{color-scheme:light;--bg:#f5f5f3;--surface:#fff;--surface2:#f8fafc;--text:#171717;--muted:#737373;--line:rgba(23,23,23,.10);--brand:#3457d5;--brand2:#2947bb;--danger:#b4233b;--danger-bg:#fff0f2;--shadow:0 28px 80px rgba(20,36,50,.13)}
    html[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--surface:#171a20;--surface2:#1c2027;--text:#f4f4f5;--muted:#9299a3;--line:rgba(255,255,255,.085);--brand:#8198ff;--brand2:#9aabff;--danger:#ff7f96;--danger-bg:#3a1c24;--shadow:0 30px 90px rgba(0,0,0,.48)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 12%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 30%),radial-gradient(circle at 88% 86%,color-mix(in srgb,var(--brand) 10%,transparent),transparent 28%)}
    .theme{position:fixed;right:18px;top:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:750;display:inline-flex;align-items:center;gap:7px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    .shell{width:min(460px,100%);position:relative}.brand{display:flex;align-items:center;gap:12px;margin:0 0 16px 4px}.brand-icon{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.35rem;box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 25%,transparent)}.brand strong{display:block;font-size:1.08rem;letter-spacing:-.02em}.brand span{font-size:.82rem;color:var(--muted)}
    .card{background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 18px 55px rgba(20,20,20,.10);backdrop-filter:blur(18px)}h1{margin:0 0 7px;font-size:1.75rem;letter-spacing:-.045em}p{margin:0 0 24px;color:var(--muted);line-height:1.55}label{display:block;font-weight:760;margin:14px 0 7px;font-size:.88rem}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--surface2);color:var(--text)}input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}button[type=submit]{width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;background:var(--brand);color:#fff;font:inherit;font-weight:820;cursor:pointer}button[type=submit]:hover{background:var(--brand2)}.error{background:var(--danger-bg);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 28%,var(--line));padding:11px 12px;border-radius:11px;margin-bottom:14px}.link-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:17px}.link-row a{color:var(--brand);font-weight:760;text-decoration:none}.link-row a:hover{text-decoration:underline}.small{font-size:.79rem;color:var(--muted);margin-top:20px;text-align:center}

    .shell{width:min(760px,100%);position:relative}
    .login-scene{position:relative;height:112px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 10px 32px rgba(20,20,20,.08);margin-bottom:16px}
    .login-scene + .brand{margin-top:4px}
    .login-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
    .login-scene .scene-light{display:block}
    html[data-theme=dark] .login-scene .scene-light{display:none}
    html[data-theme=dark] .login-scene .scene-dark{display:block}
    .login-scene-caption{position:absolute;right:12px;top:38px;padding:4px 10px;border-radius:999px;background:rgba(255,248,232,.84);color:#5f4720;font-size:.74rem;font-weight:800;box-shadow:0 2px 8px rgba(70,52,18,.12)}
    html[data-theme=dark] .login-scene-caption{background:rgba(19,18,14,.82);color:#f1d99d}
    .login-scene-caption .dark-only{display:none} html[data-theme=dark] .login-scene-caption .light-only{display:none} html[data-theme=dark] .login-scene-caption .dark-only{display:inline}
    .login-footer-scene{position:relative;height:86px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);margin-top:14px}
    .login-footer-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
    .login-footer-scene .scene-light{display:block}
    html[data-theme=dark] .login-footer-scene .scene-light{display:none}
    html[data-theme=dark] .login-footer-scene .scene-dark{display:block}
    @media(max-width:640px){.shell{width:min(520px,100%)}.login-scene{height:84px}.login-scene-caption{top:27px}.login-footer-scene{height:64px}}


  @media(max-width:640px){
    body{display:block!important;min-height:100dvh;padding:10px!important;overflow-x:hidden}
    .theme{position:fixed;right:10px;top:10px;z-index:20;padding:8px 10px;font-size:.8rem}
    .shell{width:100%!important;max-width:100%!important;margin:52px auto 18px!important}
    .login-scene{height:96px!important;border-radius:14px!important}
    .login-footer-scene{height:158px!important;border-radius:14px!important}
    .login-scene img,.login-footer-scene img{object-fit:contain!important}
    .login-scene-caption{display:none!important}
    .brand{margin:0 0 12px 2px!important}
    .brand-icon{width:38px!important;height:38px!important;border-radius:10px!important}
    .brand strong{font-size:1rem!important}.brand span{font-size:.74rem!important}
    .card{padding:20px 16px!important;border-radius:16px!important}
    h1{font-size:1.45rem!important}
    input{font-size:16px!important;min-height:48px!important}
    button[type=submit]{min-height:48px!important}
    .link-row{display:grid!important;grid-template-columns:1fr!important;text-align:center!important;gap:8px!important}
  }
</style>

<style>
:root{--v41-bg:#ddd4c4;--v41-surface:#f2ece1;--v41-surface2:#e8dfd1;--v41-text:#1f1a14;--v41-muted:#655948;--v41-line:rgba(64,49,28,.22);--v41-gold:#b07a11;--v41-gold2:#7f5708;--v41-goldsoft:#e8d39d}
html[data-theme="dark"]{--v41-bg:#0d0c0a;--v41-surface:#1a1712;--v41-surface2:#242019;--v41-text:#fff8ea;--v41-muted:#b9aa92;--v41-line:rgba(232,199,120,.18);--v41-gold:#e0b34f;--v41-gold2:#efc96e;--v41-goldsoft:#3b2f18}
body{background:var(--v41-bg)!important;color:var(--v41-text)!important}
.card,.panel,.login-card,.privacy-card,.reset-card,.viewer-shell,.map-shell,.container{border-color:var(--v41-line)!important}
input,select,textarea{background:var(--v41-surface)!important;color:var(--v41-text)!important;border-color:var(--v41-line)!important}
input:focus,select:focus,textarea:focus{border-color:var(--v41-gold)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--v41-gold) 18%,transparent)!important}
.btn-primary,button.primary,.primary{background:linear-gradient(135deg,var(--v41-gold2),var(--v41-gold))!important;color:#fffaf0!important;border-color:transparent!important}
a{color:var(--v41-gold2)}
</style>
<link rel="stylesheet" href="/static/auth.css?v={{ app_version }}">
</head>
<body>
  <div class="ambient"></div><button class="theme" id="loginThemeToggle" type="button" onclick="toggleTheme()" aria-label="Hell/Dunkel wechseln"><span id="loginThemeIcon">🌙</span><span id="loginThemeLabel">Dunkel</span></button>
  <div class="shell">
    <div class="login-scene" aria-hidden="true">
      <img class="scene-light login-banner" data-banner-tone="light" src="/static/theme/banner-light.png?v={{ app_version }}" alt="">
      <img class="scene-dark login-banner" data-banner-tone="dark" src="/static/theme/banner-dark.png?v={{ app_version }}" alt="">
      <div class="login-scene-caption"><span class="light-only">☀ Sternsinger unterwegs</span><span class="dark-only">🌙 Unter dem Stern</span></div>
    </div>
    <div class="brand"><div class="brand-icon">✨</div><div><strong>Sternsinger Verwaltung</strong><span>Planung, Einsatz und Auswertung</span></div></div>
    <main class="card">
      <h1>Willkommen zurück</h1><p>Melde dich mit deinem Benutzerkonto an.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post">
        <label for="username">Benutzername</label><input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Passwort</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Anmelden</button>
      </form>
      <div class="link-row"><a href="{{ url_for('forgot_password') }}">Passwort vergessen?</a><a href="/datenschutz">Datenschutz</a></div>
      <div class="small">{{ app_version }} · Portainer</div>
    </main>
    <div class="login-footer-scene" aria-hidden="true">
      <img class="scene-light login-banner" data-banner-tone="light" src="/static/theme/banner-light.png?v={{ app_version }}" alt="">
      <img class="scene-dark login-banner" data-banner-tone="dark" src="/static/theme/banner-dark.png?v={{ app_version }}" alt="">
    </div>
  </div>
<script>
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('sternsinger_theme',t);const btn=document.getElementById('themeToggleLabel');if(btn) btn.textContent=t==='dark'?'☀️ Hell':'🌙 Dunkel';}
const initialTheme=document.documentElement.dataset.theme||'light';const btn=document.getElementById('themeToggleLabel');if(btn) btn.textContent=initialTheme==='dark'?'☀️ Hell':'🌙 Dunkel';
</script>
</body></html>
